services:
  - type: web
    name: karma-trust-oracle
    env: docker
    dockerfilePath: ./Containerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health/liveness
    envVars:
      # Containerfile has `EXPOSE 10000`, which is what Render's Docker health checker actually
      # targets -- it does NOT read this PORT var to pick the probed port (Render's own docs only
      # promise "usually" auto-detecting a different port, which is exactly what caused a deploy-
      # timeout incident here: see git history for `karma-trust-oracle`). So the app must actually
      # listen on 10000: HTTP_PORT is KARMA's own var (src/config/env.ts) and must match. Keep
      # PORT, HTTP_PORT, and the Containerfile's EXPOSE in sync if you ever change any of them.
      #
      # IMPORTANT: editing this file does NOT update an already-created service's live env vars --
      # Render only applies render.yaml changes on an explicit Blueprint "Sync" (Dashboard ->
      # Blueprints), not on a plain push/redeploy. After changing PORT/HTTP_PORT here, go sync the
      # Blueprint (or edit the values directly under the service's Environment tab) and confirm the
      # live values before assuming a fix took effect.
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: development
      - key: TRANSPORT_DRIVER
        value: http
      - key: HTTP_HOST
        value: 0.0.0.0
      - key: HTTP_PORT
        value: "10000"
      - key: STORAGE_DRIVER
        value: fs
      - key: TELEMETRY_DRIVER
        value: stdout
      - key: MCP_PROJECT_ID
        value: KARMA
      - key: MCP_TENANT_ID
        value: tenant_public

      - key: MCP_AUTH_MODE
        value: api_key
      - key: MCP_API_KEY
        generateValue: true

      # Must match this service's onrender.com hostname — if you rename the
      # service in the Render dashboard, update these two to match.
      - key: ALLOWED_HOSTS
        value: karma-trust-oracle.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://karma-trust-oracle.onrender.com

      # Minimal plugin set: only the free trust-oracle tool + the always-on
      # system tool. No karma.tool.ts (skill economy), no Redis, no indexer —
      # get_cross_chain_trust_score reads chain state per call and needs none
      # of that (src/plugins/trust_oracle.tool.ts).
      - key: MCP_SAFE_MODE
        value: "false"
      - key: MCP_PLUGIN_ISOLATION_MODE
        value: policy
      - key: MCP_PLUGIN_ALLOWLIST
        value: system.tool.js,trust_oracle.tool.js

      - key: ENABLE_RATE_LIMIT
        value: "true"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "60"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: ENABLE_QUOTA
        value: "true"
      - key: QUOTA_DAILY_LIMIT
        value: "2000"

      # Already-deployed contracts (see main README's "Live deployments" table).
      - key: PHAROS_RPC_URL
        value: https://atlantic.dplabs-internal.com
      - key: PHAROS_CHAIN_ID
        value: "688689"
      - key: PHAROS_CONTRACT_ADDRESS
        value: "0xc6d5c146209e0833634bd33fafb9e65081b905ae"
      # Setting MCP_SAFE_MODE=false + PHAROS_CONTRACT_ADDRESS also auto-starts the on-chain skill
      # indexer (src/index.ts), which get_cross_chain_trust_score does NOT need (it reads chain
      # state live per call, per src/plugins/trust_oracle.tool.ts). Left at its default
      # KARMA_INDEXER_FROM_BLOCK=0, it backfills from genesis -- ~26.9M blocks / 2000-block chunks
      # is ~13k sequential RPC calls, easily saturating a free-tier instance for the entire health
      # check window and starving Render's port detection. Pin it near the current head instead
      # (exact value doesn't matter, it only needs to avoid the full-history scan) -- bump this
      # occasionally if it ever drifts far enough to matter again.
      - key: KARMA_INDEXER_FROM_BLOCK
        value: "26875873"

      - key: XLAYER_RPC_URL
        value: https://testrpc.xlayer.tech
      - key: XLAYER_CHAIN_ID
        value: "1952"
      - key: XLAYER_CONTRACT_ADDRESS
        value: "0xBF285628869c2EFaf6731F8503B39B7130474Cd2"
