name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # pnpm version is read from the "packageManager" field in package.json (pnpm@9.15.9).

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Audit
        run: pnpm audit --audit-level high

      - name: Dependency update signal
        run: pnpm outdated || true

  rust-odra:
    name: Rust (contracts-odra)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts-odra
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # odra-macros uses #![feature(box_patterns)], a nightly-only feature — stable can't build it.
      - name: Setup Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts-odra

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  rust-soroban:
    name: Rust (contracts-soroban / ${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [agent_credential_verifier, reputation_aggregation_verifier]
    defaults:
      run:
        working-directory: contracts-soroban/${{ matrix.crate }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts-soroban/${{ matrix.crate }}

      # testutils pulls in the host-side Soroban env so cargo test/clippy can run natively —
      # the real WASM contract build (wasm32-unknown-unknown) leaves it off.
      - name: Clippy
        run: cargo clippy --all-targets --features testutils -- -D warnings

      - name: Test
        run: cargo test --features testutils

  foundry:
    name: Foundry (contracts/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: pnpm

      # Foundry deps (openzeppelin/contracts) are pulled via the node_modules remapping in
      # foundry.toml, not a git submodule — needs a full pnpm install, not just forge deps.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # forge-std IS a real git submodule dependency (unlike openzeppelin above) but isn't
      # registered in .gitmodules, and /lib/ is gitignored (see .gitignore) — actions/checkout
      # can't fetch it, so a fresh runner needs this explicit install, same as
      # .claude/hooks/session-start.sh does for local dev sessions.
      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git

      - name: Test
        run: pnpm test:contract
